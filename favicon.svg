<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8D5A0"/>
      <stop offset=".5" stop-color="#C9A84C"/>
      <stop offset="1" stop-color="#A6882E"/>
    </linearGradient>
  </defs>

  <!-- dark rounded background -->
  <rect width="64" height="64" rx="14" fill="#1A1A1A"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="url(#g)" stroke-width="1.5" opacity=".5"/>

  <!-- scissors -->
  <g stroke="url(#g)" stroke-linecap="round" fill="none">
    <!-- finger rings -->
    <circle cx="20" cy="46" r="6.5" stroke-width="3"/>
    <circle cx="44" cy="46" r="6.5" stroke-width="3"/>
    <!-- shanks -->
    <path d="M24.5 41.5 L32 33" stroke-width="3"/>
    <path d="M39.5 41.5 L32 33" stroke-width="3"/>
    <!-- blades -->
    <path d="M32 33 L48 14" stroke-width="3.4"/>
    <path d="M32 33 L16 14" stroke-width="3.4"/>
  </g>
  <!-- pivot -->
  <circle cx="32" cy="33" r="3" fill="url(#g)"/>
  <circle cx="32" cy="33" r="1.1" fill="#1A1A1A"/>
</svg>
